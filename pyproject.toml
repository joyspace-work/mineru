[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mineru-vehicle-pipeline"
version = "0.2.0"
description = "MinerU-first vehicle source recognition and Feishu Base sync pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mineru==3.4.4",
  "paddleocr==3.7.0",
  "openpyxl==3.1.5",
  "python-dotenv==1.2.2",
  "requests==2.34.2",
  "python-docx==1.2.0",
  "python-pptx==1.0.2",
  "accelerate==1.14.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
]

[project.scripts]
mineru-pipeline = "mineru_pipeline.cli:main"
mineru-gui = "mineru_pipeline.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests_py"]
pythonpath = ["src"]
