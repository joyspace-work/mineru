[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vehicle-source-excel-pipeline"
version = "0.2.0"
description = "Excel-first vehicle source extraction and Feishu Base sync pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "openpyxl==3.1.5",
  "python-dotenv==1.2.2",
  "requests==2.34.2",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
]

[project.scripts]
mineru-pipeline = "mineru_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests_py"]
pythonpath = ["src"]
